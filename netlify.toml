[build]
  command = "npm run build"

[build.environment]
  # NEXT_PUBLIC_* vars are intentionally embedded in the client bundle (Firebase web
  # config and Stripe Payment Link URLs are not secrets - they're meant to be public).
  # Without this, Netlify's secrets scanner flags them as leaked secrets and fails the build.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_STRIPE_LINK_DEPOSIT,NEXT_PUBLIC_STRIPE_LINK_COMPLETION_BASE,NEXT_PUBLIC_STRIPE_LINK_COMPLETION_PORTAL"

[[plugins]]
  package = "@netlify/plugin-nextjs"
